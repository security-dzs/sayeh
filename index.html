<style>

<div id="menu" class="ov"><h1>پروژه سایه</h1><p>مرکز تحقیقاتی متروکه. رادیو قطع است. تنها نیستی.</p>
<small>WASD حرکت · Shift دویدن · Ctrl خم شدن · Space پرش · ماوس چپ شلیک · R ریلود · 1-4 سلاح · F چراغ‌قوه · E تعامل · I موجودی · M نقشه بزرگ · B باتری · H کیت پزشکی · Esc مکث</small>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=i=>document.getElementById(i),R=Math.random,CS=4,W=40,H=30;
let state='menu',free=0,time=0,lockReq=0;
/* ---------- Level ---------- */
const G=[...Array(H)].map(()=>Array(W).fill(1)),DM={},doors=[];
const rooms=[[2,2,8,6,'ورودی'],[14,2,8,6,'اتاق امنیت'],[26,2,10,6,'اتاق کنترل'],[2,14,10,8,'آزمایشگاه'],[16,14,8,8,'انبار'],[28,14,8,8,'اتاق ژنراتور'],[24,25,12,4,'اتاق باس']];
const inR=(x,y,r)=>x>=r[0]&&x<r[0]+r[2]&&y>=r[1]&&y<r[1]+r[3];
rooms.forEach(r=>{for(let y=r[1];y<r[1]+r[3];y++)for(let x=r[0];x<r[0]+r[2];x++)G[y][x]=0});
function carve(a,b,lock){const A=rooms[a],B=rooms[b];let x=A[0]+A[2]/2|0,y=A[1]+A[3]/2|0,bx=B[0]+B[2]/2|0,by=B[1]+B[3]/2|0,d=null;
const st=()=>{G[y][x]=0;if(!d&&!rooms.some(r=>inR(x,y,r)))d=[x,y]};
while(x!=bx){x+=Math.sign(bx-x);st()}while(y!=by){y+=Math.sign(by-y);st()}
if(d){const o={x:d[0],y:d[1],lock,open:0};doors.push(o);DM[d[1]*W+d[0]]=o}}
[[0,1],[1,2],[0,3],[3,4],[1,4],[4,5,'card'],[5,6,'power']].forEach(c=>carve(...c));
const wc=(c)=>c*CS+CS/2,roomOf=(x,z)=>rooms.findIndex(r=>inR(Math.floor(x/CS),Math.floor(z/CS),r));
const sol=(x,z)=>{const cx=Math.floor(x/CS),cy=Math.floor(z/CS),g=G[cy]?.[cx];if(g===undefined||g>0)return 1;const d=DM[cy*W+cx];return d&&!d.open?1:0};
const S={power:0};
/* ---------- Renderer ---------- */
const rd=new T.WebGLRenderer({antialias:true});rd.setPixelRatio(Math.min(devicePixelRatio,1.5));rd.setSize(innerWidth,innerHeight);
rd.shadowMap.enabled=true;rd.toneMapping=T.ACESFilmicToneMapping;rd.toneMappingExposure=.95;document.body.prepend(rd.domElement);
const sc=new T.Scene();sc.background=new T.Color(0x010102);sc.fog=new T.FogExp2(0x020203,.05);
const cam=new T.PerspectiveCamera(75,innerWidth/innerHeight,.1,90);cam.rotation.order='YXZ';sc.add(cam);
addEventListener('resize',()=>{rd.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
function tex(c,n,rep){const k=document.createElement('canvas');k.width=k.height=128;const g=k.getContext('2d');g.fillStyle=c;g.fillRect(0,0,128,128);
for(let i=0;i<n;i++){g.fillStyle=`rgba(0,0,0,${R()*.3})`;g.fillRect(R()*128,R()*128,R()*22+2,R()*3+1)}const t=new T.CanvasTexture(k);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep[0],rep[1]);return t}
const mat=(c,o={})=>new T.MeshStandardMaterial({color:c,roughness:.9,...o});
const fl=new T.Mesh(new T.PlaneGeometry(W*CS,H*CS),mat(0x666666,{map:tex('#555',500,[W/2,H/2])}));fl.rotation.x=-Math.PI/2;fl.position.set(W*CS/2,0,H*CS/2);fl.receiveShadow=true;sc.add(fl);
const ce=fl.clone();ce.material=mat(0x333333);ce.rotation.x=Math.PI/2;ce.position.y=3.6;sc.add(ce);
const wl=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(G[y][x]==1&&[-1,0,1].some(a=>[-1,0,1].some(b=>G[y+a]?.[x+b]===0)))wl.push([x,y]);
const wm=new T.InstancedMesh(new T.BoxGeometry(CS,3.6,CS),mat(0x8a8a8a,{map:tex('#6a6d70',400,[1,1])}),wl.length);const dm=new T.Object3D();
wl.forEach((c,i)=>{dm.position.set(wc(c[0]),1.8,wc(c[1]));dm.updateMatrix();wm.setMatrixAt(i,dm.matrix)});wm.castShadow=wm.receiveShadow=true;sc.add(wm);
/* props */
const props=[];
function prop(x,y,i){const m=new T.Group(),px=wc(x),pz=wc(y);G[y][x]=2;
if(i==0){for(let k=0;k<2;k++){const b=new T.Mesh(new T.BoxGeometry(1.3,1.1,1.3),mat(0x5a4a32));b.position.set(0,.55+k*1.1,0);b.rotation.y=k*.6;b.castShadow=1;m.add(b)}}
else if(i==1){const t=new T.Mesh(new T.BoxGeometry(2.4,.1,1.2),mat(0x4a4a4a));t.position.y=.9;const c=new T.Mesh(new T.BoxGeometry(.5,.9,.5),mat(0x222222));c.position.set(.2,.45,1.2);m.add(t,c)}
else if(i==2){const c=new T.Mesh(new T.BoxGeometry(1.4,2.6,.8),mat(0x3a4048));c.position.y=1.3;c.castShadow=1;m.add(c)}
else{const c=new T.Mesh(new T.CylinderGeometry(.6,.6,2.2,10),mat(0x1b4d4a,{emissive:0x0a3a30,transparent:true,opacity:.8}));c.position.y=1.1;m.add(c)}
m.position.set(px,0,pz);sc.add(m);props.push(m)}
rooms.forEach((r,ri)=>{[[r[0],r[1]],[r[0]+r[2]-1,r[1]],[r[0],r[1]+r[3]-1],[r[0]+r[2]-1,r[1]+r[3]-1]].forEach((c,k)=>prop(c[0],c[1],(k+ri)%4));
const p=new T.Mesh(new T.CylinderGeometry(.1,.1,r[2]*CS-2,6),mat(0x2a2a2a));p.rotation.z=Math.PI/2;p.position.set((r[0]+r[2]/2)*CS,3.3,(r[1]+.4)*CS);sc.add(p)});
/* lights */
sc.add(new T.AmbientLight(0x202530,.35));
const lamps=[];
rooms.forEach((r,i)=>{const red=[2,5,6].includes(i),l=new T.PointLight(red?0xff1a1a:0x8fa3b8,red?.9:.55,red?20:16,2);l.position.set((r[0]+r[2]/2)*CS,3.1,(r[1]+r[3]/2)*CS);sc.add(l);
const bulb=new T.Mesh(new T.BoxGeometry(.5,.1,.5),new T.MeshBasicMaterial({color:red?0xff3030:0xcfe0ff}));bulb.position.copy(l.position);bulb.position.y=3.55;sc.add(bulb);
lamps.push({l,b:l.intensity,red,fk:i%2==1,off:0})});
const fls=new T.SpotLight(0xfff0cc,3,34,.45,.55,1.3);fls.castShadow=true;fls.shadow.mapSize.set(512,512);fls.position.set(.1,-.1,0);cam.add(fls);fls.target.position.set(0,0,-5);cam.add(fls.target);
const mzl=new T.PointLight(0xffaa55,0,12);mzl.position.set(.2,-.1,-.9);cam.add(mzl);
/* weapons */
const WP=[{n:'Pistol',d:26,r:.3,mag:12,rec:.02,sp:.006,pel:1,auto:0,f:700,len:.3},{n:'Shotgun',d:13,r:.95,mag:6,rec:.07,sp:.06,pel:8,auto:0,f:300,len:.55},{n:'Assault Rifle',d:22,r:.11,mag:30,rec:.012,sp:.01,pel:1,auto:1,f:500,len:.6},{n:'SMG',d:14,r:.065,mag:40,rec:.008,sp:.018,pel:1,auto:1,f:1100,len:.4}];
const gun=new T.Mesh(new T.BoxGeometry(.07,.1,1),mat(0x111111,{roughness:.4}));gun.position.set(.22,-.2,-.5);cam.add(gun);
const mf=new T.Mesh(new T.PlaneGeometry(.25,.25),new T.MeshBasicMaterial({color:0xffcc66,transparent:true,opacity:.9}));mf.position.set(0,0,-.55);mf.visible=false;gun.add(mf);
/* player */
const P={x:wc(4),z:wc(4),y:1.7,vy:0,yaw:0,pitch:0,hp:100,w:0,rl:0,fc:0,bat:100,fl:1,card:0,inv:{a:90,b:1,m:1},a:WP.map(w=>({m:w.mag})),docs:[],crouch:0,sh:0,kick:0,st:0,bob:0,hb:0,fx:0};
const K={};
/* ---------- Items / interactables ---------- */
const NT=['گزارش ۱ — پروژه «سایه»: آزمایش روی نیروهای ویژه برای ساخت سربازانی که در تاریکی قوی‌تر می‌شوند. ارتباط رادیویی مرکز عمداً قطع شده است.','یادداشت امنیتی: برای راه‌اندازی ژنراتور کلیدهای برق را به ترتیب ۲ ← ۳ ← ۱ فعال کنید. در امنیتی فقط با کارت دسترسی باز می‌شود.','لاگ دوربین: تیم شما ۳ روز پیش وارد شد. هیچ‌کس خارج نشد. یکی از آن‌ها هنوز در راهروها شما را تماشا می‌کند.','گزارش پزشکی: «Stalker» همان سروان کاوه از تیم شماست. او نیمه‌جهش‌یافته است و از شما می‌ترسد؛ فقط نگاه می‌کند و وقتی نگاهش کنید ناپدید می‌شود.','فایل محرمانه: نمونه صفر در اتاق باس نگهداری می‌شود. نکته: ورود بازرس عمداً برنامه‌ریزی شده بود. تیم شما برای آزمایش «طعمه» بود.'];
const items=[],ints=[];
const IT=[[0,1,1,'n',0],[0,-2,0,'a'],[1,1,-1,'b'],[1,-2,1,'n',1],[1,2,0,'m'],[2,0,1,'k'],[2,2,-1,'a'],[2,-3,0,'b'],[3,2,1,'n',3],[3,-1,2,'a'],[3,3,-2,'m'],[3,-4,0,'b'],[4,1,2,'n',4],[4,-2,-2,'a'],[4,2,-1,'a'],[5,-2,2,'b'],[5,3,1,'m'],[6,-3,0,'a']];
const IC={a:[0xd4a017,'مهمات'],b:[0x33aaff,'باتری'],m:[0xff3355,'کیت پزشکی'],k:[0x22ff88,'کارت دسترسی'],n:[0xeeeeee,'سند']};
IT.forEach((d,i)=>{const r=rooms[d[0]],x=(r[0]+r[2]/2|0)+d[1],y=(r[1]+r[3]/2|0)+d[2],c=IC[d[3]];
const m=new T.Mesh(d[3]=='n'?new T.BoxGeometry(.5,.03,.7):new T.BoxGeometry(.4,.25,.4),new T.MeshStandardMaterial({color:c[0],emissive:c[0],emissiveIntensity:.5}));m.position.set(wc(x),.5,wc(y));sc.add(m);
const it={m,t:d[3],n:d[4],taken:0};items.push(it);
ints.push({x:m.position.x,z:m.position.z,on:()=>!it.taken,lab:()=>'[ E ] برداشتن '+c[1],go:()=>{take(it);saveCP(d[3]=='k')}})});
function take(it){it.taken=1;it.m.visible=false;const t=it.t;
if(t=='a'){P.inv.a+=30;snd.pick()}else if(t=='b'){P.inv.b++;snd.pick()}else if(t=='m'){P.inv.m++;snd.pick()}
else if(t=='k'){P.card=1;snd.pick();msg('کارت دسترسی پیدا شد. اتاق ژنراتور را باز کن.')}else{if(!P.docs.includes(it.n))P.docs.push(it.n);readNote(it.n)}objUp()}
doors.forEach(d=>{const m=new T.Mesh(new T.BoxGeometry(CS*.95,3.4,CS*.95),mat(0x3b3f45,{metalness:.6,roughness:.5}));m.position.set(wc(d.x),1.7,wc(d.y));m.castShadow=1;sc.add(m);d.m=m;
const led=new T.Mesh(new T.BoxGeometry(.2,.2,.2),new T.MeshBasicMaterial({color:d.lock?0xff2020:0x20ff20}));led.position.set(0,1,CS*.5);m.add(led);d.led=led;
ints.push({x:m.position.x,z:m.position.z,on:()=>1,lab:()=>d.open?'[ E ] بستن در':(d.lock&&!openable(d)?'🔒 قفل — '+(d.lock=='card'?'نیاز به کارت دسترسی':'نیاز به برق'):'[ E ] باز کردن در'),go:()=>{if(d.open)setDoor(d,0);else if(openable(d))setDoor(d,1);else{snd.tone(150,.2,.4,'square');msg(d.lock=='card'?'نیاز به کارت دسترسی':'برق قطع است')}}})});
const openable=d=>!d.lock||(d.lock=='card'&&P.card)||(d.lock=='power'&&S.power);
function setDoor(d,o){d.open=o;d.m.visible=!o;snd.door(d.m.position)}
// computer
{const r=rooms[2],x=wc(r[0]+r[2]-2),z=wc(r[1]);const m=new T.Mesh(new T.BoxGeometry(1.2,.8,.2),new T.MeshBasicMaterial({color:0x33ff99}));m.position.set(x,1.4,z+.5);sc.add(m);
ints.push({x,z:z+1,on:()=>1,lab:()=>'[ E ] استفاده از کامپیوتر',go:()=>{if(!P.docs.includes(2))P.docs.push(2);readNote(2)}})}
// switches & generator
const SW=[],seq=[];let gen={on:0};
{const r=rooms[5];[0,1,2].forEach(i=>{const x=wc(r[0]+1+i*2),z=r[1]*CS+.7;const m=new T.Mesh(new T.BoxGeometry(.5,.8,.2),new T.MeshStandardMaterial({color:0x552222,emissive:0x330000}));m.position.set(x,1.4,z);sc.add(m);SW.push(m);
ints.push({x,z:z+.8,on:()=>!S.sw,lab:()=>'[ E ] کلید برق '+(i+1),go:()=>{snd.tone(300,.1,.5,'square');seq.push(i);m.material.emissive.setHex(0x00aa00);const ok=[1,2,0];
if(seq.some((v,k)=>v!=ok[k])){seq.length=0;SW.forEach(s=>s.material.emissive.setHex(0x330000));snd.nz(.4,.7,3000,1);dark(1.2);msg('ترتیب اشتباه! جرقه...')}else if(seq.length==3){S.sw=1;msg('کلیدها فعال شدند. ژنراتور را روشن کن.');objUp()}}})});
const gx=wc(r[0]+r[2]-2),gz=wc(r[1]+r[3]-2),g=new T.Mesh(new T.BoxGeometry(2,1.6,1.2),mat(0x3d5a2a));g.position.set(gx,.8,gz);g.castShadow=1;sc.add(g);
ints.push({x:gx,z:gz,on:()=>!gen.on,lab:()=>S.sw?'[ E ] روشن کردن ژنراتور':'ژنراتور — ابتدا کلیدها',go:()=>{if(!S.sw){msg('کلیدهای برق فعال نیستند');return}gen.on=S.power=1;lamps.forEach(l=>l.red=0);snd.nz(1.5,.6,200,1);snd.tone(50,2,.6,'sawtooth');msg('برق متصل شد! در اتاق باس باز شد.');objUp();saveCP(1)}})}
/* ---------- Particles ---------- */
const pt=[...Array(60)].map(()=>{const m=new T.Mesh(new T.BoxGeometry(.06,.06,.06),new T.MeshBasicMaterial({color:0xffffff}));m.visible=false;sc.add(m);return{m,v:new T.Vector3(),l:0}});
function burst(p,c,n){for(let i=0;i<n;i++){const q=pt.find(q=>q.l<=0);if(!q)return;q.l=.5+R()*.4;q.m.visible=true;q.m.material.color.setHex(c);q.m.position.copy(p);q.v.set(R()-.5,R()*.8,R()-.5).multiplyScalar(4)}}
/* ---------- Audio ---------- */
let AC,MG,NB,drone;
const snd={tone(){},nz(){},pick(){},door(){},grow(){}};
function ainit(){if(AC)return;AC=new AudioContext();MG=AC.createGain();MG.gain.value=.8;MG.connect(AC.destination);
NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;
const out=p=>{if(!p)return MG;const n=AC.createPanner();n.panningModel='HRTF';n.refDistance=3;n.rolloffFactor=1.3;n.positionX.value=p.x;n.positionY.value=p.y||1.5;n.positionZ.value=p.z;n.connect(MG);return n};
snd.tone=(f,dur,v,ty='sine',p,fe)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;if(fe)o.frequency.exponentialRampToValueAtTime(fe,AC.currentTime+dur);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);o.connect(g).connect(out(p));o.start();o.stop(AC.currentTime+dur)};
snd.nz=(dur,v,f,q,p)=>{const s=AC.createBufferSource(),b=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;b.type='bandpass';b.frequency.value=f;b.Q.value=q;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);s.connect(b).connect(g).connect(out(p));s.start();s.stop(AC.currentTime+dur)};
snd.pick=()=>snd.tone(900,.12,.3,'triangle');snd.door=p=>{snd.tone(140,.6,.4,'sawtooth',{x:p.x,z:p.z},50);snd.nz(.3,.3,300,2,{x:p.x,z:p.z})};
snd.grow=(t,p)=>{if(t=='shadow')snd.nz(.8,.5,3200,4,p);else if(t=='stalker')snd.nz(1.6,.25,1100,5,p);else snd.tone(t=='boss'?40:70,1,.6,'sawtooth',p,t=='boss'?30:45)};
// ambience: drone + wind
const o=AC.createOscillator(),lp=AC.createBiquadFilter();drone=AC.createGain();drone.gain.value=.12;o.type='sawtooth';o.frequency.value=43;lp.type='lowpass';lp.frequency.value=140;o.connect(lp).connect(drone).connect(MG);o.start();

seen.forEach(k=>{const x=k%W,y=k/W|0,g=G[y][x],d=DM[k];mc.fillStyle=d?(d.open?'#2a2':d.lock&&!openable(d)?'#c22':'#cc2'):g==1?'#2e2e33':g==2?'#654':'#777';mc.fillRect(ox+x*cs,oy+y*cs,cs-(g==1?0:1),cs-(g==1?0:1))});
rooms.forEach((r,i)=>{if(bigMap&&seen.has((r[1]+1)*W+r[0]+1)){mc.fillStyle='#fffa';mc.font='10px Tahoma';mc.fillText(r[4],ox+r[0]*cs+3,oy+r[1]*cs+11)}});
let tg;if(!P.card)tg=items.find(i=>i.t=='k').m.position;else if(!S.sw||!S.power){const r=rooms[5];tg={x:(r[0]+r[2]/2)*CS,z:(r[1]+r[3]/2)*CS}}else{const r=rooms[6];tg={x:(r[0]+r[2]/2)*CS,z:(r[1]+r[3]/2)*CS}}
const tx=ox+tg.x/CS*cs,ty=oy+tg.z/CS*cs;if(tx>4&&ty>4&&tx<w-4&&ty<h-4){mc.fillStyle=`rgba(255,210,0,${.5+.5*Math.sin(time*5)})`;mc.beginPath();mc.arc(tx,ty,4,0,7);mc.fill()}
mc.save();mc.translate(ox+px*cs,oy+py*cs);mc.rotate(-P.yaw);mc.fillStyle='#ff3030';mc.beginPath();mc.moveTo(0,-6);mc.lineTo(4.5,5);mc.lineTo(-4.5,5);mc.closePath();mc.fill();mc.restore();
mc.fillStyle='#fff9';mc.font='10px Tahoma';mc.fillText('M',w-12,12)}
/* ---------- Input ---------- */
const cv=rd.domElement;
function lock(){try{cv.requestPointerLock();clearTimeout(lockReq);lockReq=setTimeout(()=>{if(!document.pointerLockElement)free=1},400)}catch(e){free=1}}
document.addEventListener('pointerlockerror',()=>free=1);
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&state=='play'&&!free)pause()});
function pause(){state='pause';$('pz').hidden=false}
function resume(){state='play';$('pz').hidden=true;$('inv').hidden=true;if(!free)lock()}
addEventListener('mousemove',e=>{if(state!='play'||(!document.pointerLockElement&&!free))return;P.yaw-=e.movementX*.0022;P.pitch-=e.movementY*.0022});
addEventListener('mousedown',e=>{if(state=='play'&&e.button==0){K.Mouse=1;if(!document.pointerLockElement&&!free)lock();else if(!WP[P.w].auto||true)fire()}});
addEventListener('mouseup',()=>K.Mouse=0);
addEventListener('keyup',e=>K[e.code]=0);
addEventListener('keydown',e=>{K[e.code]=1;if(e.code=='Space'||e.code=='ControlLeft')e.preventDefault();
if(e.code=='Escape'&&free){state=='play'?pause():state=='pause'&&resume();return}
if(e.code=='KeyI'){if(state=='play')openInv();else if(state=='inv')resume();return}
if(state!='play')return;
if(e.code=='KeyM'){bigMap=!bigMap;mm.className='a'+(bigMap?' big':'')}if(e.code=='KeyR')reload();if(e.code=='KeyF'&&P.bat>0){P.fl=!P.fl;snd.tone(1200,.03,.2,'square')}
if(e.code=='KeyE'&&P.ia)P.ia.go();
if(e.code=='KeyB'&&P.inv.b>0&&P.bat<100){P.inv.b--;P.bat=Math.min(100,P.bat+50);snd.pick()}
if(e.code=='KeyH'&&P.inv.m>0&&P.hp<100){P.inv.m--;P.hp=Math.min(100,P.hp+50);snd.pick()}
if(/Digit[1-4]/.test(e.code)&&P.rl<=0){P.w=+e.code[5]-1;P.kick=.05}});
function openInv(){state='inv';document.exitPointerLock();const v=$('inv');v.hidden=false;
v.innerHTML=`<h1 style="font-size:28px">موجودی</h1><p>مهمات: ${P.inv.a} · باتری: ${P.inv.b} (B) · کیت پزشکی: ${P.inv.m} (H) · کارت دسترسی: ${P.card?'✔':'✘'}</p><h3>اسناد</h3>`+(P.docs.map(i=>`<div class="d" data-i="${i}">${NT[i].slice(0,45)}…</div>`).join('')||'<small>هنوز سندی پیدا نشده</small>')+'<button id="cl">بستن (I)</button>';
v.querySelectorAll('.d').forEach(d=>d.onclick=()=>readNote(+d.dataset.i));$('cl').onclick=resume}
function begin(load){ainit();AC.resume();$('menu').hidden=true;if(load&&CP)apply(CP);state='play';lock();objUp();if(!CP)saveCP()}
$('go').onclick=()=>begin(0);$('ct').onclick=()=>{try{CP=localStorage.getItem('hz1')}catch(e){}begin(1)};
$('rs').onclick=resume;$('rp').onclick=()=>{$('dead').hidden=true;apply(CP);state='play';lock()};
try{if(localStorage.getItem('hz1'))$('ct').hidden=false}catch(e){}
/* ---------- Loop ---------- */
let last=performance.now();
(function loop(n){requestAnimationFrame(loop);const dt=Math.min(.05,(n-last)/1000);last=n;if(state=='play')upd(dt);else{cam.position.set(P.x,P.y,P.z);cam.rotation.set(P.pitch,P.yaw,0)}rd.render(sc,cam)})(last);
</script></body></html>
